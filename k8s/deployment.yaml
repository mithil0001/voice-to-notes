apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-to-notes
  labels:
    app: voice-to-notes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: voice-to-notes
  template:
    metadata:
      labels:
        app: voice-to-notes
    spec:
      containers:
        - name: voice-to-notes
          image: youracrname.azurecr.io/voice-to-notes:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: voice-to-notes-config
            - secretRef:
                name: voice-to-notes-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: notes-storage
              mountPath: /app/instance
      volumes:
        - name: notes-storage
          persistentVolumeClaim:
            claimName: voice-to-notes-pvc
